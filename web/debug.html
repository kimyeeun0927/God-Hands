<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HANDSEAL DEBUG</title>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.all.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100vh; width: 100vw; font-family: monospace; }
    #input-video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); z-index: 0; }
    #overlay-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
    #panel {
      position: fixed; top: 0; left: 0; z-index: 10;
      background: rgba(0,0,0,0.72); color: #F5E6C3;
      padding: 14px 18px; min-width: 320px;
      border-bottom-right-radius: 10px;
    }
    #status { font-size: 12px; color: #FFB800; margin-bottom: 4px; }
    #detect-info { font-size: 11px; color: rgba(245,230,195,0.7); margin-bottom: 10px; }
    #top-pred { font-size: 28px; font-weight: bold; color: #4ADE80; margin-bottom: 12px; }
    .prob-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; font-size: 12px; }
    .prob-label { width: 60px; flex-shrink: 0; }
    .prob-bar-wrap { flex: 1; background: rgba(255,255,255,0.08); height: 12px; border-radius: 3px; overflow: hidden; }
    .prob-bar { height: 100%; background: #FFB800; }
    .prob-pct { width: 44px; text-align: right; flex-shrink: 0; color: rgba(245,230,195,0.85); }
    .prob-row.is-top .prob-bar { background: #4ADE80; }
    .prob-row.is-top .prob-label, .prob-row.is-top .prob-pct { color: #4ADE80; font-weight: bold; }
  </style>
</head>
<body>
  <video id="input-video" playsinline autoplay muted></video>
  <canvas id="overlay-canvas"></canvas>

  <div id="panel">
    <div id="status">초기화중...</div>
    <div id="detect-info">손 감지: -- | FPS: -- | 검출: --ms</div>
    <div id="top-pred">--</div>
    <div id="prob-list"></div>
  </div>

  <script type="module" src="src/debug.js"></script>
</body>
</html>
